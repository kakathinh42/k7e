name: CI

# Run on every push to main/develop and on PRs targeting main.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token: jobs only need to read the repo.
permissions:
  contents: read

jobs:
  # ── Python: lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv sync --no-dev
      - run: uv run ruff check apps tests
      - run: uv run ruff format --check apps tests

  # ── Python: unit tests (SQLite, no external services) ───────────────────────
  python-tests:
    name: Python tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # uv workspace installs api + worker + mcp + dev deps from uv.lock.
      - run: uv venv --python ${{ matrix.python-version }}
      - run: uv sync
      # Exclude suites that need Postgres/Temporal (separate jobs below) and
      # the corpus bench (needs the synthetic eval corpus / fake embeddings).
      - name: Run pytest
        run: |
          uv run pytest -q \
            --ignore tests/api/test_pgvector_search.py \
            -k "not pg and not temporal and not bench"

  # ── Python: Postgres + pgvector integration ─────────────────────────────────
  postgres-tests:
    name: Python tests (Postgres + pgvector)
    runs-on: ubuntu-latest
    env:
      WIKI_TEST_PG_DSN: postgresql+psycopg://wiki:wiki@localhost:5432/wiki_ci
    services:
      postgres:
        image: pgvector/pgvector:pg16
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: wiki
          POSTGRES_PASSWORD: wiki
          POSTGRES_DB: wiki_ci
        options: >-
          --health-cmd "pg_isready -U wiki"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv sync
      # Run the full migration chain base→head→base→head against throwaway PG,
      # then the pgvector + RBAC + tenant-backfill suites that skip without a DB.
      - name: Migration round-trip
        run: |
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run alembic -c apps/api/alembic.ini downgrade base
          uv run alembic -c apps/api/alembic.ini upgrade head
        env:
          DATABASE_URL: ${{ env.WIKI_TEST_PG_DSN }}
      - name: Postgres-gated tests
        run: uv run pytest -q tests/api/test_pgvector_search.py tests/api/test_rbac_migration.py tests/api/test_tenant_backfill_migration.py tests/api/test_classification_migration.py tests/api/test_team_migration.py tests/api/test_clientapp_delegation_migration.py -k "not temporal and not bench"

  # ── Python: Temporal integration ────────────────────────────────────────────
  temporal-tests:
    name: Python tests (Temporal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Install Temporal dev server (CLI)
        run: go install github.com/temporalio/cli/cmd/temporal@latest
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv sync
      - name: Start Temporal dev server
        run: $(go env GOPATH)/bin/temporal server start-dev --ip 0.0.0.0 --port 7233 &
      - name: Run worker tests
        run: uv run pytest -q tests/worker -k "not bench"
        env:
          TEMPORAL_HOST: localhost:7233

  # ── Web: React + Vite SPA type-check, build, and unit tests ─────────────────
  web-tests:
    name: Web tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Unit tests
        run: npm test

  # ── Security: dependency + secret scanning ──────────────────────────────────
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: pip-audit (Python, lock-aware)
        run: uv run --with pip-audit pip-audit --strict
      - name: npm audit (web)
        run: cd apps/web && npm audit --omit=dev --audit-level=high
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Docker images build ─────────────────────────────────────────────────────
  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, mcp, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          load: false
