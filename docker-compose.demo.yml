# docker-compose.demo.yml — offline demo stack (no LLM gateway key).
#
# Self-contained: Postgres+pgvector, Temporal, api, worker — with the LLM and
# embedding clients swapped for deterministic in-process stubs
# (LLM_CLIENT_IMPL=stub, EMBEDDING_CLIENT_IMPL=stub). No LiteLLM, web, or MCP:
# the demo exercises the api + worker over HTTP via scripts/demo.sh.
#
# Usage:  docker compose -f docker-compose.demo.yml up --build
#   (or:  make demo  — which also runs scripts/demo.sh)
#
# Shares the pgdata volume name with the main compose so a prior `docker
# compose up` migration state is reused; use `docker volume rm k7e_pgdata`
# for a fully fresh run.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: wiki
      POSTGRES_DB: wiki
    ports: ["5435:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/temporal:1.3.0
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports: ["7234:7233"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "namespace", "list", "--address", "localhost:7233"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://wiki:wiki@postgres:5432/wiki
      TEMPORAL_HOST: temporal:7233
      LITELLM_BASE_URL: http://localhost:4000   # unused: stub client is selected
      LITELLM_API_KEY: sk-unused
      OBJECT_STORE_PATH: /data/objects
      OKF_BUNDLE_PATH: /data/okf-bundle
      # Offline demo: deterministic stub LLM (no gateway). Embeddings are
      # disabled because the DB vector column is 1536-dim (text-embedding-3-small)
      # while the stub produces 256-dim vectors; keyword+recency search still
      # finds the compiled page by title. Vector-search quality is covered by
      # the eval suite (tests/api/test_search_bench.py).
      LLM_CLIENT_IMPL: stub
      EMBEDDINGS_ENABLED: "false"
      JWT_ENABLED: "false"
      ENV: dev
    volumes: ["objects:/data/objects", "okfbundle:/data/okf-bundle:ro"]
    ports: ["8001:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    environment:
      DATABASE_URL: postgresql+psycopg://wiki:wiki@postgres:5432/wiki
      TEMPORAL_HOST: temporal:7233
      LITELLM_BASE_URL: http://localhost:4000
      LITELLM_API_KEY: sk-unused
      OBJECT_STORE_PATH: /data/objects
      OKF_BUNDLE_PATH: /data/okf-bundle
      # Offline demo: stub LLM, embeddings disabled (see api service note).
      LLM_CLIENT_IMPL: stub
      EMBEDDINGS_ENABLED: "false"
    volumes: ["objects:/data/objects", "okfbundle:/data/okf-bundle"]
    depends_on:
      postgres: { condition: service_healthy }
      temporal: { condition: service_started }

volumes:
  pgdata:
  objects:
  okfbundle:
