# A generic, single database configuration.

[alembic]
# Path to migration scripts, relative to this file's directory.
script_location = %(here)s/alembic

# Prepend sys.path so that env.py can import k7e_api.
prepend_sys_path = .

# Template for generated revision filenames.
file_template = %%(rev)s_%%(slug)s

# Separator for multiple version directories.
version_path_separator = os

# The default database URL.  env.py always overrides this from Settings /
# the DATABASE_URL environment variable, so this value is only used when
# running alembic commands without that variable set.
sqlalchemy.url = postgresql+psycopg://wiki:wiki@localhost:5432/wiki


# ---------------------------------------------------------------------------
# Logging configuration
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
